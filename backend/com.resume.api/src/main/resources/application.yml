server:
  port: 8080

spring:
  application:
    name: resume-api
  datasource:
    url: jdbc:mysql://localhost:3306/resume?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: 123456
      timeout: 3s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

jwt:
  secret: ${JWT_SECRET:}
  access-ttl: 30m
  refresh-ttl: 7d
  issuer: resume-api

security:
  login-fail:
    window: 10m
    threshold: 5
    lock-duration: 15m

logging:
  level:
    com.resume.api: info
